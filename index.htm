<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de Seguimiento de Locales Educativos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    @media print {
      @page { margin: 8mm; size: A4 portrait; }
      body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .no-print { display: none !important; }
      #ficha-contenedor {
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
        max-width: 100% !important;
      }
      .bloque-seccion { break-inside: avoid; page-break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen text-xs">

  <!-- Barra superior (oculta al imprimir) -->
  <header class="no-print bg-[#1b2a4a] text-white shadow sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-1.5 h-7 bg-red-600 rounded-full"></div>
        <div>
          <p class="text-[10px] uppercase tracking-widest text-slate-300 leading-none">Sistema de Consulta Institucional</p>
          <h1 class="text-sm font-bold tracking-tight mt-0.5">Ficha Consolidada de Locales Educativos</h1>
        </div>
      </div>
      <button onclick="window.print()" id="btn-imprimir" disabled
        class="bg-white/10 hover:bg-white/20 disabled:opacity-40 border border-white/20 text-white text-xs font-semibold px-3.5 py-1.5 rounded-md transition cursor-pointer flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        Imprimir / Guardar PDF
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-4">
    <!-- Panel de búsqueda (oculto al imprimir) -->
    <section class="no-print bg-white rounded-lg shadow-sm border border-slate-200 p-3 mb-4">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-2 items-center">
        <div class="md:col-span-3">
          <select id="filtro-ugel" class="w-full border border-slate-300 rounded-md px-2.5 py-1.5 text-xs bg-slate-50 focus:outline-none focus:ring-2 focus:ring-[#1b2a4a]">
            <option value="">Todas las UGEL</option>
          </select>
        </div>
        <div class="md:col-span-7">
          <input type="text" id="buscador" placeholder="Buscar por Código Local, nombre de IIEE, distrito..."
            class="w-full border border-slate-300 rounded-md px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#1b2a4a]">
        </div>
        <div class="md:col-span-2">
          <button onclick="limpiarBusqueda()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs px-3 py-1.5 rounded-md border border-slate-300 transition cursor-pointer">
            Limpiar
          </button>
        </div>
      </div>
      <div class="flex justify-between items-center mt-2">
        <p id="estado-carga" class="text-[11px] text-slate-500">Conectando con Google Sheets...</p>
        <p id="contador-resultados" class="text-[11px] text-slate-400"></p>
      </div>

      <!-- Lista de resultados -->
      <div id="lista-resultados" class="mt-2 max-h-44 overflow-y-auto divide-y divide-slate-100 border-t border-slate-100"></div>
    </section>

    <!-- Contenedor de la Ficha -->
    <article id="ficha-contenedor" class="hidden bg-white rounded-lg shadow-md border border-slate-200 overflow-hidden">
      <!-- Encabezado compacto de la ficha -->
      <div class="bg-gradient-to-r from-[#1b2a4a] to-[#263c66] text-white px-5 py-3.5 flex flex-wrap justify-between items-center gap-2">
        <div>
          <div class="flex items-center gap-2">
            <span id="ficha-ugel" class="text-[10px] font-bold uppercase tracking-wider bg-red-700 px-2 py-0.5 rounded"></span>
            <span id="ficha-distrito" class="text-[10px] uppercase tracking-wider text-slate-300"></span>
          </div>
          <h2 id="ficha-titulo" class="text-base font-bold mt-1 leading-tight">Nombre de la IIEE</h2>
          <p id="ficha-subtitulo" class="text-[11px] text-blue-200 mt-0.5"></p>
        </div>
        <div class="text-right">
          <p class="text-[10px] uppercase tracking-wider text-slate-300">Código Local</p>
          <p id="ficha-codigo" class="text-sm font-bold font-mono bg-white/10 px-2.5 py-0.5 rounded mt-0.5"></p>
        </div>
      </div>

      <!-- Cuerpo agrupado -->
      <div id="ficha-secciones" class="p-4 space-y-3"></div>

      <!-- Pie de ficha -->
      <div class="bg-slate-50 border-t border-slate-200 px-5 py-2 text-[10px] text-slate-500 flex justify-between">
        <span>Ficha generada automáticamente desde la base consolidada.</span>
        <span id="fecha-impresion"></span>
      </div>
    </article>
  </main>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxCtFuaJAvJVU0jEKrtjkNSXNGLTbbF1KE8DW_1gU99CeOQ1tiM0D6CHojkKQoIETNpwJQ9tl1K7By/pub?gid=0&single=true&output=csv";

    // Definición exacta de bloques según la estructura de tu tabla (por índice de columna base 0)
    const SECCIONES = [
      {
        grupo: "INFORMACIÓN BASE",
        titulo: "Información General de Locales Educativos",
        tema: "navy",
        cols: [0, 1, 2, 3, 4, 5, 6, 7],
        grid: "grid-cols-2 sm:grid-cols-4"
      },
      {
        grupo: "INFO UGEL",
        titulo: "Saneamiento, Predio y Seguridad (ITSE)",
        tema: "red",
        cols: [8, 9, 10, 11, 12],
        grid: "grid-cols-2 sm:grid-cols-3 md:grid-cols-5"
      },
      {
        grupo: "INFORMACIÓN BASE",
        titulo: "Información según DIPLAN",
        tema: "navy",
        cols: [13, 14, 15, 16],
        grid: "grid-cols-2 sm:grid-cols-4"
      },
      {
        grupo: "INFORMACIÓN SEGÚN UGEL",
        titulo: "Infraestructura",
        tema: "red",
        cols: [17, 18, 19, 20, 21],
        grid: "grid-cols-2 sm:grid-cols-3 md:grid-cols-5"
      },
      {
        grupo: "INFORMACIÓN SEGÚN UGEL",
        titulo: "Cerco Perimétrico",
        tema: "red",
        cols: [22, 23, 24],
        grid: "grid-cols-1 sm:grid-cols-3"
      },
      {
        grupo: "INFORMACIÓN SEGÚN UGEL",
        titulo: "Servicios Higiénicos MPF",
        tema: "red",
        cols: [25, 26, 27, 28],
        grid: "grid-cols-2 sm:grid-cols-4"
      },
      {
        grupo: "INFORMACIÓN SEGÚN UGEL",
        titulo: "Arrendatarios",
        tema: "red",
        cols: [29, 30],
        grid: "grid-cols-1 sm:grid-cols-2"
      },
      {
        grupo: "INFORMACIÓN SEGÚN UGEL",
        titulo: "Módulos Prefabricados (PRONIED UGME / PEIP)",
        tema: "red",
        cols: [31, 32, 33, 34, 35, 36, 37, 38],
        grid: "grid-cols-2 sm:grid-cols-4"
      },
      {
        grupo: "INFORMACIÓN SEGÚN UGEL",
        titulo: "Aulas Acondicionadas",
        tema: "red",
        cols: [39, 40, 41, 42, 43, 44],
        grid: "grid-cols-2 sm:grid-cols-3"
      },
      {
        grupo: "INFORMACIÓN SEGÚN UGEL",
        titulo: "Requerimiento de Aulas",
        tema: "red",
        cols: [45, 46, 47],
        grid: "grid-cols-1 sm:grid-cols-3"
      },
      {
        grupo: "INFORMACIÓN SEGÚN UGEL",
        titulo: "Contingencia",
        tema: "red",
        cols: [48, 49, 50, 51, 52, 53],
        grid: "grid-cols-2 sm:grid-cols-3"
      },
      {
        grupo: "INFORMACIÓN SEGÚN UGEL",
        titulo: "Servicios Básicos y Observaciones",
        tema: "red",
        cols: [54, 55, 56, 57, 58, 59, 60],
        grid: "grid-cols-2 sm:grid-cols-3"
      },
      {
        grupo: "TRAZABILIDAD CONSOLIDADO",
        titulo: "Control de Origen",
        tema: "teal",
        cols: [61, 62],
        grid: "grid-cols-1 sm:grid-cols-2"
      }
    ];

    const TEMAS = {
      navy: { header: "bg-[#1b2a4a] text-white", badge: "bg-blue-900/60 text-blue-100", border: "border-slate-200" },
      red:  { header: "bg-[#8b1a1a] text-white", badge: "bg-red-950/50 text-red-100",   border: "border-red-100" },
      teal: { header: "bg-[#0f5959] text-white", badge: "bg-teal-950/50 text-teal-100", border: "border-teal-100" }
    };

    let encabezados = [];
    let filasDatos = [];

    function iniciar() {
      Papa.parse(CSV_URL, {
        download: true,
        header: false,
        skipEmptyLines: true,
        complete: function(res) {
          const matriz = res.data;
          // Detecta automáticamente la fila de encabezados reales (donde aparece CODIGO LOCAL o IIEE)
          let idxHeader = matriz.findIndex(fila =>
            fila.some(celda => {
              const t = String(celda || "").toUpperCase().trim();
              return t === "CODIGO LOCAL" || t === "CÓDIGO LOCAL" || t === "IIEE";
            })
          );
          if (idxHeader === -1) idxHeader = 0;

          encabezados = matriz[idxHeader].map(h => String(h || "").trim());
          filasDatos = matriz.slice(idxHeader + 1).filter(f => f.some(c => String(c || "").trim() !== ""));

          poblarFiltroUGEL();
          document.getElementById("estado-carga").textContent = `Base conectada: ${filasDatos.length} locales educativos.`;
          aplicarFiltros();
        },
        error: function() {
          document.getElementById("estado-carga").textContent = "Error al leer el CSV. Verifica tu conexión o el enlace publicado.";
        }
      });
    }

    function poblarFiltroUGEL() {
      const select = document.getElementById("filtro-ugel");
      const ugeles = [...new Set(filasDatos.map(f => (f[6] || "").trim()).filter(Boolean))].sort();
      ugeles.forEach(u => {
        const opt = document.createElement("option");
        opt.value = u;
        opt.textContent = u;
        select.appendChild(opt);
      });
    }

    function aplicarFiltros() {
      const texto = document.getElementById("buscador").value.toLowerCase().trim();
      const ugelSel = document.getElementById("filtro-ugel").value;

      const filtrados = filasDatos.filter(fila => {
        const cumpleUgel = !ugelSel || (fila[6] || "").trim() === ugelSel;
        const cumpleTexto = !texto || fila.some(val => String(val || "").toLowerCase().includes(texto));
        return cumpleUgel && cumpleTexto;
      });

      document.getElementById("contador-resultados").textContent = `Mostrando ${Math.min(filtrados.length, 30)} de ${filtrados.length}`;
      renderizarResultados(filtrados.slice(0, 30));
    }

    function renderizarResultados(lista) {
      const contenedor = document.getElementById("lista-resultados");
      contenedor.innerHTML = "";

      if (lista.length === 0) {
        contenedor.innerHTML = `<p class="text-xs text-slate-500 py-2">No se encontraron coincidencias.</p>`;
        return;
      }

      lista.forEach(fila => {
        const cod = fila[1] || "S/C";
        const iiee = fila[2] || "Sin nombre";
        const distrito = fila[5] || "";
        const ugel = fila[6] || "";

        const btn = document.createElement("button");
        btn.className = "w-full text-left px-2.5 py-1.5 hover:bg-blue-50/80 transition flex justify-between items-center cursor-pointer";
        btn.innerHTML = `
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="text-[10px] font-mono font-semibold bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded border border-slate-200 shrink-0">${cod}</span>
            <div class="truncate">
              <p class="text-xs font-semibold text-slate-800 truncate">${iiee}</p>
              <p class="text-[10px] text-slate-500">${ugel}${distrito ? " · " + distrito : ""}</p>
            </div>
          </div>
          <span class="text-[11px] font-semibold text-[#1b2a4a] shrink-0 ml-2">Ver ficha →</span>
        `;
        btn.onclick = () => mostrarFicha(fila);
        contenedor.appendChild(btn);
      });
    }

    function formatearValor(valor) {
      const v = String(valor || "").trim();
      if (!v) return `<span class="text-slate-400">—</span>`;
      const upper = v.toUpperCase();
      if (upper === "SI" || upper === "SÍ") {
        return `<span class="inline-block bg-emerald-50 text-emerald-700 border border-emerald-200 font-semibold text-[10px] px-1.5 py-0.2 rounded">SÍ</span>`;
      }
      if (upper === "NO") {
        return `<span class="inline-block bg-slate-100 text-slate-600 border border-slate-200 font-semibold text-[10px] px-1.5 py-0.2 rounded">NO</span>`;
      }
      return v;
    }

    function mostrarFicha(fila) {
      document.getElementById("ficha-codigo").textContent = fila[1] || "—";
      document.getElementById("ficha-titulo").textContent = fila[2] || "Sin nombre";
      document.getElementById("ficha-subtitulo").textContent = [fila[3], fila[4]].filter(Boolean).join(" · ");
      document.getElementById("ficha-ugel").textContent = fila[6] || "UGEL";
      document.getElementById("ficha-distrito").textContent = fila[5] || "";
      document.getElementById("fecha-impresion").textContent = "Consulta: " + new Date().toLocaleString("es-PE");

      const contenedor = document.getElementById("ficha-secciones");
      contenedor.innerHTML = "";

      SECCIONES.forEach(sec => {
        const estilo = TEMAS[sec.tema];
        const bloque = document.createElement("section");
        bloque.className = `bloque-seccion rounded-md border ${estilo.border} overflow-hidden`;

        const camposHTML = sec.cols.map(idx => {
          if (idx >= encabezados.length) return "";
          const etiqueta = encabezados[idx] || `Columna ${idx + 1}`;
          const valor = fila[idx] || "";
          // Si es la columna de OBSERVACIONES (60), que ocupe todo el ancho
          const spanClass = idx === 60 ? "col-span-full" : "";
          return `
            <div class="${spanClass} bg-slate-50/70 border border-slate-200/80 rounded px-2.5 py-1.5">
              <p class="text-[9.5px] font-semibold uppercase tracking-wide text-slate-500 leading-tight">${etiqueta}</p>
              <div class="text-[11.5px] text-slate-900 font-medium mt-0.5 leading-snug whitespace-pre-line">${formatearValor(valor)}</div>
            </div>
          `;
        }).join("");

        bloque.innerHTML = `
          <div class="${estilo.header} px-3 py-1.5 flex justify-between items-center">
            <h3 class="text-[11px] font-bold uppercase tracking-wide">${sec.titulo}</h3>
            <span class="${estilo.badge} text-[9px] font-semibold uppercase px-2 py-0.5 rounded">${sec.grupo}</span>
          </div>
          <div class="p-2.5 grid ${sec.grid} gap-2 bg-white">
            ${camposHTML}
          </div>
        `;
        contenedor.appendChild(bloque);
      });

      document.getElementById("ficha-contenedor").classList.remove("hidden");
      document.getElementById("btn-imprimir").disabled = false;
    }

    document.getElementById("buscador").addEventListener("input", aplicarFiltros);
    document.getElementById("filtro-ugel").addEventListener("change", aplicarFiltros);

    function limpiarBusqueda() {
      document.getElementById("buscador").value = "";
      document.getElementById("filtro-ugel").value = "";
      aplicarFiltros();
    }

    iniciar();
  </script>
</body>
</html>
